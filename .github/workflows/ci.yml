name: ci

# CONSTRAINTS.md CI 행 자동화 — gitleaks·osv·ArchUnit 포함 be 전 suite + fe check 전량.
# 로컬의 `npm run check:full`와 동일 항목을 ubuntu 스텝으로 푼 것이다 (루트 스크립트는 Windows 전용).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # 랜딩 gzip ≤150kB 게이트 (CONSTRAINTS)
      - run: npx size-limit

  be:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # 테스트는 Testcontainers로 MySQL을 띄운다 — runner docker 그대로 사용
      - run: chmod +x gradlew && ./gradlew test jacocoTestReport

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks는 이력 전체 스캔 필요

      # 개인 계정 repo라 GITLEAKS_LICENSE 불필요 — PR 이벤트는 GITHUB_TOKEN 필수
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 루트 action.yml은 실행 정의 없이 메타뿐 — 실제 액션은 서브디렉터리 경로로 지정
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ./
