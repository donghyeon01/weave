name: ci

# CONSTRAINTS.md CI 행 자동화 — gitleaks·osv·ArchUnit 포함 be 전 suite + fe check 전량.
# 로컬의 `npm run check:full`와 동일 항목을 ubuntu 스텝으로 푼 것이다 (루트 스크립트는 Windows 전용).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # 랜딩 gzip ≤150kB 게이트 (CONSTRAINTS)
      - run: npx size-limit

  be:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 Testcontainers로 MySQL을 띄운다 — runner docker 그대로 사용
      - run: chmod +x gradlew && ./gradlew test jacocoTestReport

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks는 이력 전체 스캔 필요

      - uses: gitleaks/gitleaks-action@v2

      - uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            -r
            .
