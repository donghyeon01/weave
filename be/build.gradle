plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'app.weave'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// osv-scanner는 gradle.lockfile 기준으로 스캔 — locking 없으면 be 의존성이
// 'high 이상 0건' 게이트 밖에 놓인다 (이슈 #3 F12). lockfile은 커밋 대상.
dependencyLocking {
    lockAllConfigurations()
}

// osv 잔여 패치 핀 — Boot 관리 버전이 추월하면 제거 (이슈 #3)
ext['tomcat.version'] = '10.1.61'
ext['jackson-bom.version'] = '2.21.8'
ext['log4j2.version'] = '2.25.5'
ext['commons-lang3.version'] = '3.18.0'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    // testcontainers가 끌어오는 1.24.0은 osv medium 2건 — 1.28.0으로 고정 (이슈 #3)
    testImplementation 'org.apache.commons:commons-compress:1.28.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 앱 설정(jackson·hibernate.jdbc.time_zone·JDBC serverTimezone)이 전부 Asia/Seoul
    // wall-clock 의미론 — runner JVM TZ(UTC)에 따라 시각 경계가 어긋나는 것을 고정
    systemProperty 'user.timezone', 'Asia/Seoul'
}

jacocoTestReport {
    dependsOn test
}
