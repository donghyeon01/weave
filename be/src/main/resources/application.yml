spring:
  application:
    name: weave
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:weave}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:weave}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
  web:
    resources:
      add-mappings: true
  servlet:
    multipart:
      # 일기 사진 계약 — 장당 5MB (api-contract §3.5)
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8081}

weave:
  # 일기 사진 로컬 디스크 스토리지 루트 — prod는 볼륨 마운트 경로(/data/uploads)
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  demo-enabled: ${DEMO_ENABLED:false}
  jwt-secret: ${JWT_SECRET:dev-only-secret-override-with-env-32bytes!!}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  # cross-site 배포는 refresh 쿠키가 fe 도메인과 API 도메인을 가로질러야 해서 None 필수
  cookie-samesite: ${COOKIE_SAMESITE:Strict}

app:
  cors:
    # 5173=dev, 4173=vite preview (check:preview E2E가 preview에서 인증을 통과해야 한다)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
