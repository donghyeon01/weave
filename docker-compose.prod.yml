# OCI 단일 박스 prod — caddy(자동 HTTPS·API 프록시) + be + mysql.
# fe는 Vercel에 배포하므로 여기 없다. OCI 실환경은 기존 nginx가 80/443 점유 —
# caddy 대신 docker-compose.oci.yml 오버라이드로 be만 localhost 게시한다. 사용:
#   cp .env.production.example .env.production  # 값 채우기
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: weave
      MYSQL_USER: weave
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  be:
    build: ./be
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: weave
      MYSQL_USER: weave
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 둘러보기용 데모 계정 발급 허용 — .env.production의 DEMO_ENABLED로 제어 (기본 off)
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      # fe(vercel.app)와 API(nip.io)는 cross-site — refresh 쿠키 전송에 None 필수
      COOKIE_SAMESITE: None
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # 일기 사진 로컬 스토리지 — 호스트 ~/weave-ops/uploads에 두어 재배포·백업 경로와 맞춘다
      UPLOAD_DIR: /data/uploads
      TZ: Asia/Seoul
    volumes:
      - ${HOST_UPLOAD_DIR:-~/weave-ops/uploads}:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [be]

volumes:
  mysql-data:
  caddy-data:
