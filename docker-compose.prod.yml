# OCI 단일 박스 prod — caddy(자동 HTTPS·API 프록시) + be + mysql.
# fe는 Cloudflare Pages에 배포하므로 여기 없다. 사용:
#   cp .env.production.example .env.production  # 값 채우기
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: weave
      MYSQL_USER: weave
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  be:
    build: ./be
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: weave
      MYSQL_USER: weave
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DEMO_ENABLED: "false"
      # fe(pages.dev)와 API(nip.io)는 cross-site — refresh 쿠키 전송에 None 필수
      COOKIE_SAMESITE: None
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [be]

volumes:
  mysql-data:
  caddy-data:
